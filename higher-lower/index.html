<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f1226">
  <title>Higher / Lower – Mini Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="hl.css">
</head>
<body class="hl-body">
  <header class="topbar hl-top">
    <a class="back" href="../" aria-label="Back">‹</a>
    <h1>Higher / Lower</h1>
    <span class="right">🔥 <b id="score">0</b> · 🏆 <b id="best">0</b></span>
  </header>

  <div class="hl-question" id="question">
    <span class="cat" id="catLabel"></span>
    <span class="q" id="qText">Loading…</span>
  </div>

  <main class="hl-split" id="split">
    <button class="half left" id="left"></button>
    <div class="vs" id="vs">VS</div>
    <button class="half right" id="right"></button>
  </main>

  <div class="hl-source" id="source"></div>

  <div id="overlay" class="overlay hidden"></div>

  <script src="../js/common.js"></script>
  <script src="hl.js"></script>
</body>
</html>
